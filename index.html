<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GitHub Pages 시작 페이지" />
  <title>Ryan Project</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #172033;
    }

    .card {
      width: min(680px, 100%);
      padding: 48px 36px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e8fff3;
      color: #087a48;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.1;
    }

    p {
      margin: 0 auto;
      max-width: 520px;
      color: #5b6474;
      font-size: 18px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 30px;
      color: #9aa2b1;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">GitHub Pages 연결 완료</div>
    <h1>Ryan Project</h1>
    <p>
      index.html 파일이 정상적으로 배포되었습니다.<br />
      이 내용을 원하는 홈페이지 내용으로 수정해서 사용하세요.
    </p>
    <div class="footer">Powered by GitHub Pages</div>
  </main>
</body>
</html>
