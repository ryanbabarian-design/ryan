<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="하나금속 제안 접수·검색·심사 관리 시스템">
  <meta name="theme-color" content="#07111f">
  <title>하나금속 제안관리</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header class="site-header">
    <button class="brand" type="button" data-route="dashboard" aria-label="HANA METAL 대시보드">
      <img class="brand-logo" src="./assets/hana-metal-logo.png" alt="HANA METAL">
    </button>

    <nav class="main-nav" aria-label="주요 메뉴">
      <button class="nav-link active" data-route="dashboard">대시보드</button>
      <button class="nav-link" data-route="new">제안 접수</button>
      <button class="nav-link" data-route="list">접수현황</button>
    </nav>

    <div class="header-right">
      <span id="modeBadge" class="mode-badge demo">데모 모드</span>
      <button class="admin-nav" data-route="admin">관리자</button>
    </div>
  </header>

  <main id="app" aria-live="polite">
    <div class="loading-card">
      <div class="spinner"></div>
      <p>제안관리 화면을 준비하고 있습니다.</p>
    </div>
  </main>

  <footer class="site-footer">
    하나금속 제안관리 · 공개 제안 DB / 관리자 심사 분리형
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <dialog id="lightbox">
    <button class="lightbox-close" type="button" data-action="close-lightbox" aria-label="사진 닫기">×</button>
    <img id="lightboxImage" alt="확대 사진">
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
