<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../../css/proposal-draft.css">
<template id="editor"><form id="proposalForm">
<select name="proposer_name"><option value=""></option><option data-department="생산" data-employee-id="a">김철수</option><option data-department="안전" data-employee-id="b">김철수</option></select>
<input name="department"><input name="category" value="안전"><input name="title"><input name="edit_pin"><input name="website">
<div data-rich-field="current_problem" contenteditable="true"></div><textarea name="current_problem" hidden></textarea><textarea name="improvement_plan"></textarea><textarea name="expected_effect"></textarea>
<input name="implementation_status" value="미실시"><input name="implemented_date"><div class="proposal-evaluation-wrap" data-evaluation-prefix="first"><div class="proposal-evaluation-scroll"><table class="proposal-evaluation-table"><tbody></tbody></table></div></div>
<div class="form-submit-bar"><input type="checkbox" required><button type="submit">제출</button></div></form></template><main></main>
<script type="module">
const checks = [];
const eq = (a,b) => { if (a !== b) throw Error(JSON.stringify(a) + ' differs from ' + JSON.stringify(b)); };
const check = async (name, fn) => {try { await fn(); checks.push({name}); } catch(e) {checks.push({name,error:e.stack});}};
const wait = async fn => {for(let i=0;i<100;i++){if(fn()) return;await new Promise(r=>setTimeout(r,20));} throw Error('Condition did not become true');};
const empty = () => ({before:{existing:[],files:[]},after:{existing:[],files:[]}});
const scores = ['originality','effort','feasibility','applicability','continuity','tangible_effect'];
let draft, form, images, mount;
async function open(key, revision='rev1', recoveryOnly=false) {
  draft?.destroy();
  document.querySelector('main').replaceChildren(document.querySelector('#editor').content.cloneNode(true));
  form = document.querySelector('form');
  form.querySelector('tbody').innerHTML=scores.map((s,i)=>'<tr><td class="eval-no">1</td><td class="eval-label">'+s+'</td><td>기준</td><td class="eval-range">1~10</td><td class="eval-weight">'+[2,2,1,1,1,3][i]+'</td><td class="eval-score"><input name="first_eval_'+s+'" type="number"></td></tr><tr><td>다음 기준</td><td class="eval-range">1~4</td></tr>').join('');
  images=empty();
  draft=mount(form,{key,recoveryOnly,sourceUpdatedAt:revision,syncEditors(f){f.elements.current_problem.value=f.querySelector('[data-rich-field]').innerHTML;},
    restoreEditors(f){f.querySelector('[data-rich-field]').innerHTML=f.elements.current_problem.value;},
    sanitizeHtml(html){const div=document.createElement('div');div.innerHTML=html;div.querySelectorAll('script,img').forEach(n=>n.remove());return div.innerHTML;},
    readImages:()=>images,restoreImages:value=>images=value});
  await draft.ready;
}
const act = key => form.querySelector('[data-draft-action="'+key+'"]').click();
const input = () => form.dispatchEvent(new Event('input',{bubbles:true}));
try {
  ({mountProposalDraft:mount}=await import('../../js/editor/proposal-draft.js'));
  if (location.search === '?lost-response') {
    const original = Storage.prototype.setItem;
    Storage.prototype.setItem = function(key,value) {
      if (this === localStorage) throw new DOMException('quota','QuotaExceededError');
      return original.call(this,key,value);
    };
    const retry=Boolean(sessionStorage.getItem('fixture-server-receipts'));
    await open('lost-response','rev1',retry);
    if(retry && form.querySelector('[data-draft-action="restore"]')){
      act('restore');await wait(()=>draft.canRetrySubmission());
    }
    form.elements.title.value='접수 시도';input();await draft.flush();
    await draft.prepareSubmission({title:form.elements.title.value,edit_pin:'1234'},[],[]);
    const id=draft.getRequestId();
    const committed = JSON.parse(sessionStorage.getItem('fixture-server-receipts') || '{}');
    if (!committed[id]) committed[id]='Q-'+(Object.keys(committed).length+1);
    if (!sessionStorage.getItem('fixture-server-receipts')) {
      sessionStorage.setItem('fixture-server-receipts',JSON.stringify(committed));
      // Simulate a committed server transaction whose acknowledgement was lost.
      location.reload();
      await new Promise(()=>{});
    }
    await check('actual reload retries the committed request with the original IndexedDB-backed ID',async()=>{
      eq(Object.keys(committed).length,1);eq(committed[id],'Q-1');
      await draft.markSubmitted(committed[id]);eq(draft.getReceipt().proposal_no,'Q-1');
    });
  } else {
  await check('restores exact employee, safe rich text and actual photograph bytes; PIN and honeypot never enter storage',async()=>{
    await open('recovery'); const id=draft.getRequestId();form.elements.title.value='첫 제목';
    form.elements.proposer_name.selectedIndex=2;form.elements.department.value='안전';
    form.elements.edit_pin.value='8726';form.elements.website.value='HONEYPOT';
    form.querySelector('[data-rich-field]').innerHTML='<b>문제</b><img src="/bad">';
    images.before.files.push(new File(['photo bytes'],'사진.jpg',{type:'image/jpeg'}));input();
    eq(await draft.flush(),true);const stored=JSON.stringify(localStorage);eq(stored.includes('8726'),false);eq(stored.includes('HONEYPOT'),false);
    await open('recovery','rev2');eq(form.elements.title.value,'');eq(draft.getRequestId(),id);
    eq(form.textContent.includes('변경'),true);act('restore');
    await wait(()=>images.before.files.length===1);
    eq(form.elements.title.value,'첫 제목');eq(form.elements.proposer_name.selectedIndex,2);
    eq(form.elements.edit_pin.value,'');eq(form.querySelector('[data-rich-field]').innerHTML,'<b>문제</b>');
    eq(await images.before.files[0].text(),'photo bytes');eq(images.before.files[0].name,'사진.jpg');
    eq(draft.getSourceUpdatedAt(),'rev1');
  });
  await check('same-tab navigation flushes without debounce and leaves pending restore intact across repeated visits',async()=>{
    await open('navigate');form.elements.title.value='방금 입력';input();await open('elsewhere');await open('navigate');await open('elsewhere');await open('navigate');
    act('restore');await wait(()=>form.elements.title.value==='방금 입력');
  });
  await check('discard and deliberate clear start with independent request IDs',async()=>{
    await open('discard');const id=draft.getRequestId();form.elements.title.value='폐기';input();await open('discard');act('discard');
    await wait(()=>draft.getRequestId()!==id);await draft.clear();await open('discard');eq(form.elements.title.value,'');eq(!!form.querySelector('[data-draft-action="restore"]:not([hidden])'),false);
  });
  await check('seven required groups include weighted evaluation and conditional implementation date, PIN and consent',async()=>{
    await open('progress');const f=form.elements;f.proposer_name.selectedIndex=1;f.department.value='생산';f.title.value='개선';form.querySelector('[data-rich-field]').innerHTML='<p>현재</p>';
    f.improvement_plan.value='방안';f.expected_effect.value='효과';f.edit_pin.value='1234';form.querySelector('[type=checkbox]').checked=true;
    for(const key of scores)f['first_eval_'+key].value='5';
    input();await wait(()=>form.querySelector('progress').value===7);
    f.implementation_status.value='완료';f.first_eval_originality.value='3';input();
    await wait(()=>form.querySelector('progress').value===5);form.querySelector('[data-draft-jump="implemented_date"]').click();eq(document.activeElement,f.implemented_date);
    f.edit_pin.value='';form.querySelector('[type=checkbox]').checked=false;input();await wait(()=>form.querySelector('progress').value===4);
  });
  await check('preview escapes title and sanitizes rich markup',async()=>{
    await open('preview');form.elements.title.value='<b>제목</b>';form.querySelector('[data-rich-field]').innerHTML='<b>허용</b><img src="/bad">';act('preview');
    const dialog=document.querySelector('dialog[open]');eq(dialog.textContent.includes('<b>제목</b>'),true);eq(dialog.querySelector('b').textContent,'허용');eq(!!dialog.querySelector('img'),false);
  });
  await check('receipt survives refresh and late flush; submission remains locked',async()=>{
    await open('receipt');form.elements.title.value='제출';input();const id=draft.getRequestId();
    draft.markSubmitted({proposal_no:'Q-001',edit_pin:'9876'});await draft.flush();await open('receipt');eq(draft.getRequestId(),id);
    eq(draft.getReceipt().proposal_no,'Q-001');eq(form.querySelector('[type=submit]').disabled,true);eq(JSON.stringify(localStorage).includes('9876'),false);
  });
  await check('text storage failure is visible and flush reports failure', async()=>{
    await open('quota');const original=Storage.prototype.setItem;Storage.prototype.setItem=()=>{throw new DOMException('full','QuotaExceededError');};
    try{form.elements.title.value='미저장';input();eq(await draft.flush(),false);eq(form.textContent.includes('저장하지 못'),true);}finally{Storage.prototype.setItem=original;}
  });
  }
} catch(e){checks.push({name:'draft controller is available',error:e.stack});}
window.draftChecks = checks;
</script></html>
